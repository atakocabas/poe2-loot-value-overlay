<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PoE2 Loot Value Overlay</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      Ships in the minimal, heads-up form because that is the resting state — the panel shows the last
      thing you copied and nothing else until the toggle-list hotkey opens it. `setMinimalMode` starts
      from `true` to match and early-returns when unchanged, so without the class here the first paint
      would be the full panel with no push to correct it.
    -->
    <div id="panel" class="minimal">
      <div id="panel-header">
        <div id="price-status"></div>
        <!-- Starts hidden so the header doesn't reserve a blank row before poe.ninja first answers. -->
        <div id="rate-status" class="hidden"></div>
        <!--
          The trade2 rate-limit countdown. Hidden like the two lines around it, and for the same
          reason: most of the time there is no cooldown to report, and a permanent blank row is worse
          than an appearing one. Note this is the *rate limit*, not #rate-status above, which is the
          currency conversion rates — "rate" means two different things in this header.
        -->
        <div id="cooldown-status" class="hidden"></div>
        <!--
          Ships hidden and is revealed, like #rate-status above and for the same reason: there is
          nothing to say until the release check answers, and a current install never gets a line at
          all — so reserving the row would leave a permanent blank one on most machines.

          A button because it is the only thing in this header you can press. Hidden in the minimal
          form (see style.css), which also means it is only ever on screen while the panel is
          interactive — it can never look live while clicks are passing through.
        -->
        <button id="update-status" class="hidden" type="button"></button>
      </div>
      <!--
        Static rather than rebuilt per render: these used to be recreated on every keystroke, which
        blew away focus and the caret position and needed restoring by hand.
      -->
      <div id="list-filters">
        <input id="list-search" type="search" placeholder="Search name or base…" />
        <select id="list-sort">
          <option value="time" selected>Newest</option>
          <option value="value">Value</option>
          <option value="name">Name</option>
        </select>
        <label class="filter-toggle"><input id="list-unpriced" type="checkbox" />Unpriced</label>
      </div>
      <!--
        Captures that don't have a price yet. Deliberately *above* #item-list rather than inside it:
        outside the scrolling region these stay visible wherever the list is scrolled to, and the
        list's scrollTop save/restore never has to account for rows coming and going on their own
        schedule. Starts hidden so nothing is reserved while there's nothing pending.
      -->
      <div id="pending-list" class="hidden"></div>
      <!-- The one list, and the only scrolling region. -->
      <div id="item-list"></div>
      <div id="list-empty" class="empty-note">No drops captured yet — Ctrl+C an item in game.</div>
      <div id="panel-footer">
        <!--
          Forces the poe.ninja pull that otherwise happens on a 10-minute timer. Here rather than
          beside the header's price-age line because this is a between-maps action, and the footer is
          where the panel-wide ones already live — it inherits the minimal-mode hide with them.
        -->
        <!--
          Abandons the lookup in flight. First in the footer because it is the only button here
          that is ever urgent — a trade2 search can sit on a rate-limit lockout for half an hour,
          and everything captured afterwards queues behind it. Ships disabled, and stays that way
          unless something is actually being looked up, so it reads as "nothing to stop" rather
          than as broken.
        -->
        <button id="stop-pricing" type="button" disabled>Stop</button>
        <button id="refresh-prices" type="button">Refresh prices</button>
        <button id="export-csv" type="button">Export CSV</button>
        <button id="clear-history" type="button">Clear all</button>
      </div>
      <div id="disclaimer">This product isn't affiliated with or endorsed by Grinding Gear Games in any way.</div>
    </div>
    <div id="item-tooltip" class="hidden"></div>
    <!-- common.js first: it declares the value/format/row helpers index.js calls. -->
    <script src="common.js"></script>
    <script src="index.js"></script>
  </body>
</html>
