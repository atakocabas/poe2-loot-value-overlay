<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PoE2 Loot Value Overlay</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      Ships in the minimal, heads-up form because that is the resting state — the panel shows the last
      thing you copied and nothing else until the toggle-list hotkey opens it. `setMinimalMode` starts
      from `true` to match and early-returns when unchanged, so without the class here the first paint
      would be the full panel with no push to correct it.
    -->
    <div id="panel" class="minimal">
      <div id="panel-header">
        <div id="panel-header-top">
          <!--
            Shown only while a map is running. Ships hidden and is revealed, like #rate-status below:
            out of a map the renderer's first `latestSession` is the *previous*, ended map, so
            shipping this visible would flash a finished map's total on every launch.
          -->
          <span id="session-total-line" class="hidden">Map total: <strong id="session-total">?</strong></span>
        </div>
        <div id="session-status">No active map</div>
        <div id="price-status"></div>
        <!-- Starts hidden so the header doesn't reserve a blank row before poe.ninja first answers. -->
        <div id="rate-status" class="hidden"></div>
      </div>
      <!--
        Static rather than rebuilt per render: these used to be recreated on every keystroke, which
        blew away focus and the caret position and needed restoring by hand.
      -->
      <div id="list-filters">
        <input id="list-search" type="search" placeholder="Search name or base…" />
        <select id="list-sort">
          <option value="time" selected>Newest</option>
          <option value="value">Value</option>
          <option value="name">Name</option>
        </select>
        <label class="filter-toggle"><input id="list-unpriced" type="checkbox" />Unpriced</label>
      </div>
      <!--
        Captures that don't have a price yet. Deliberately *above* #item-list rather than inside it:
        outside the scrolling region these stay visible wherever the list is scrolled to, and the
        list's scrollTop save/restore never has to account for rows coming and going on their own
        schedule. Starts hidden so nothing is reserved while there's nothing pending.
      -->
      <div id="pending-list" class="hidden"></div>
      <!-- The one list, and the only scrolling region. -->
      <div id="item-list"></div>
      <div id="list-empty" class="empty-note">No drops captured yet — Ctrl+C an item in game.</div>
      <div id="panel-footer">
        <button id="export-csv" type="button">Export CSV</button>
        <button id="clear-history" type="button">Clear all</button>
      </div>
      <div id="disclaimer">This product isn't affiliated with or endorsed by Grinding Gear Games in any way.</div>
    </div>
    <div id="item-tooltip" class="hidden"></div>
    <!-- common.js first: it declares the value/format/row helpers index.js calls. -->
    <script src="common.js"></script>
    <script src="index.js"></script>
  </body>
</html>
